name: dotnet-based-wasm-component-on-wasmcloud-in-aks
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
env:
  LOCATION: swedencentral
  RESOURCE_GROUP: rg-dotnet-on-wasmcloud
  AKS_CLUSTER: aks-dotnet-on-wasmcloud
  
jobs:
  create-aks-cluster-and-container-registry:
    runs-on: ubuntu-latest
    steps:
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Create Resource Group
      run: |
        az group create --location ${LOCATION} --resource-group ${RESOURCE_GROUP}
    - name: Create AKS Cluster
      run: |
        az aks create --name ${AKS_CLUSTER} --location ${LOCATION} --resource-group ${RESOURCE_GROUP} --node-count 1 --generate-ssh-keys
    - name: Create Container Registry
      run: |
        az acr create --name ${CONTAINER_REGISTRY} --location ${LOCATION} --resource-group ${RESOURCE_GROUP} --sku Basic --admin-enabled true
    - name: Log Out From Azure
      run: |
        az logout
        az cache purge
        az account clear
  deploy-wasmcloud:
    needs: [create-aks-cluster-and-container-registry]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Get AKS Credentials
      run: |
        az aks get-credentials --name ${AKS_CLUSTER} --resource-group ${RESOURCE_GROUP}
    - name: Install NATS, Wadm, and wasmCloud Operator subcharts
      run: |
        kubectl create namespace wasmcloud
        helm upgrade --install wasmcloud-platform --values https://raw.githubusercontent.com/wasmCloud/wasmcloud/main/charts/wasmcloud-platform/values.yaml oci://ghcr.io/wasmcloud/charts/wasmcloud-platform:0.1.2 --dependency-update
        kubectl rollout status deploy,sts -l app.kubernetes.io/name=nats
        kubectl wait --for=condition=available --timeout=600s deploy -l app.kubernetes.io/name=wadm
        kubectl wait --for=condition=available --timeout=600s deploy -l app.kubernetes.io/name=wasmcloud-operator
    - name: Log Out From Azure
      run: |
        docker logout
        az logout
        az cache purge
        az account clear
  build-and-push-wasi-http-component:
    needs: [create-aks-cluster-and-container-registry]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup .NET 10.0 SDK
      uses: actions/setup-dotnet@v4.0.0
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    - name: Build
      run: dotnet build ./src/Demo.Wasi.Http --configuration Release

  